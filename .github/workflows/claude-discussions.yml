# Answers @claude mentions in GitHub Discussions. Replies are posted by github-actions[bot] and
# say they come from Claude: Anthropic's app-token exchange only accepts its own action, which
# does not handle Discussions. Needs a repository secret CLAUDE_CODE_OAUTH_TOKEN made with
# `claude setup-token` on a Claude subscription. Anyone may ask. When someone outside the team uses
# more than CLAUDE_ALERT_USD (a repository variable; $3 at API prices if unset) in any 6 hours, an
# issue titled "Discussions usage" gets a comment with their tokens and models, for a maintainer to
# look at. Setting CLAUDE_DAILY_LIMIT (and optionally CLAUDE_PERSON_LIMIT) turns on a daily limit
# instead. It is advisory: runs that start together can each pass it, and it is not a spend cap. Answers worth keeping are suggested for the FAQ in an issue.
name: Claude in Discussions

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

concurrency:
  group: claude-discussion-${{ github.event.discussion.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: >-
      github.event.sender.type != 'Bot' &&
      contains(github.event_name == 'discussion' && github.event.discussion.body || github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      discussions: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the daily limit
        id: limit
        if: vars.CLAUDE_DAILY_LIMIT != ''
        env:
          GH_TOKEN: ${{ github.token }}
          WHO: ${{ github.event.sender.login }}
          ROLE: ${{ github.event.comment.author_association || github.event.discussion.author_association }}
          DAILY: ${{ vars.CLAUDE_DAILY_LIMIT }}
          EACH: ${{ vars.CLAUDE_PERSON_LIMIT || vars.CLAUDE_DAILY_LIMIT }}
        run: |
          since=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          # Who started each other run of the last day that asked Claude, or may still.
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/claude-discussions.yml/runs?created=%3E%3D$since&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"skipped\") | \"\(.id) \(.triggering_actor.login)\"" \
            > "$RUNNER_TEMP/runs.txt"
          : > "$RUNNER_TEMP/asked.txt"
          while read -r id actor; do
            spent=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
              --jq '[.jobs[].steps[]? | select(.name == "Ask Claude" and .conclusion != "skipped")] | length > 0')
            if [ "$spent" = true ]; then echo "$actor" >> "$RUNNER_TEMP/asked.txt"; fi
          done < "$RUNNER_TEMP/runs.txt"
          total=$(grep -c . "$RUNNER_TEMP/asked.txt" || true)
          mine=$(grep -cxF "$WHO" "$RUNNER_TEMP/asked.txt" || true)
          echo "Asked in the last day: $total in all, $mine by $WHO."
          # The repository's own people are held only to the daily limit.
          case "$ROLE" in OWNER|MEMBER|COLLABORATOR) mine=0 ;; esac
          if [ "$total" -ge "$DAILY" ] || [ "$mine" -ge "$EACH" ]; then echo "over=true" >> "$GITHUB_OUTPUT"; fi

      - name: Gather the thread
        id: thread
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.discussion.number }}
          COMMENT_ID: ${{ github.event.comment.node_id }}
        run: |
          gh api graphql -F n="$NUMBER" -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner:String!,$name:String!,$n:Int!){repository(owner:$owner,name:$name){discussion(number:$n){
              id title body author{login}
              comments(first:100){nodes{id body author{login} replies(first:100){nodes{id body author{login}}}}}}}}' \
            > "$RUNNER_TEMP/thread.json"
          # The mention is marked with a tag made for this run, so text in the thread cannot pass for it.
          mark="[mention $(openssl rand -hex 6)]"
          jq -r --arg c "$COMMENT_ID" --arg m " $mark" '.data.repository.discussion as $d |
            "## Discussion: \($d.title)\n\n**\($d.author.login // "unknown"):**\(if $c == "" then $m else "" end)\n\($d.body)\n",
            ($d.comments.nodes[] | "---\n**\(.author.login // "unknown"):**\(if .id == $c then $m else "" end)\n\(.body)\n",
              (.replies.nodes[] | "> **reply from \(.author.login // "unknown"):**\(if .id == $c then $m else "" end)\n\(.body)\n"))' \
            "$RUNNER_TEMP/thread.json" > "$RUNNER_TEMP/thread.md"
          reply_to=""
          if [ -n "$COMMENT_ID" ]; then
            # The history above stops at 100 comments and 100 replies, so the mention is fetched by its own
            # ID: it is added if the history missed it, and it names the top-level comment to reply under.
            gh api graphql -f id="$COMMENT_ID" -f query='
              query($id:ID!){node(id:$id){... on DiscussionComment{id body author{login} replyTo{id}}}}' \
              > "$RUNNER_TEMP/trigger.json"
            if ! jq -e --arg c "$COMMENT_ID" '[.. | objects | select(.id? == $c)] | length > 0' "$RUNNER_TEMP/thread.json" > /dev/null; then
              {
                printf -- '---\n**%s:** %s\n' "$(jq -r '.data.node.author.login // "unknown"' "$RUNNER_TEMP/trigger.json")" "$mark"
                jq -r '.data.node.body' "$RUNNER_TEMP/trigger.json"
              } >> "$RUNNER_TEMP/thread.md"
            fi
            # A reply to a reply has to hang off the top-level comment.
            reply_to=$(jq -r '.data.node.replyTo.id // .data.node.id // ""' "$RUNNER_TEMP/trigger.json")
            if [ -z "$reply_to" ]; then echo "::error::Could not find the comment that mentioned Claude."; exit 1; fi
          fi
          {
            echo "discussion_id=$(jq -r .data.repository.discussion.id "$RUNNER_TEMP/thread.json")"
            echo "reply_to=$reply_to"
            echo "mark=$mark"
          } >> "$GITHUB_OUTPUT"
          # Titles of the other discussions, so an earlier answer can be linked instead of written again.
          gh api graphql -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner:String!,$name:String!){repository(owner:$owner,name:$name){
              discussions(first:100,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{number title url isAnswered}}}}' |
            jq -r --argjson n "$NUMBER" '.data.repository.discussions.nodes[] | select(.number != $n) |
              "- [\(.title)](\(.url))\(if .isAnswered then " (answered)" else "" end)"' > "$RUNNER_TEMP/earlier.md"

      - name: Ask Claude
        id: ask
        if: steps.limit.outputs.over != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WHO: ${{ github.event.sender.login }}
          MARK: ${{ steps.thread.outputs.mark }}
          ROLE: ${{ github.event.comment.author_association || github.event.discussion.author_association }}
        run: |
          npm install -g --silent @anthropic-ai/claude-code@2.1.310
          mkdir -p "$RUNNER_TEMP/usage"
          {
            cat .github/claude/discussion-prompt.md
            for f in README.md AGENTS.md CONTRIBUTING.md docs/design-decisions.md docs/app-spec.md docs/FAQ.md; do
              printf '\n\n# Project document: %s\n\n' "$f"; cat "$f"
            done
            printf '\n\n# The website FAQ, at https://help.andeye.com/#faq (each question links as #faq-<name>)\n\n'
            sed -n '/<section class="deep" id="faq">/,/<\/section>/p' site/index.html |
              sed -E 's/.*id="(faq-[a-z-]+)".*<h3>(.*)<\/h3>.*/\n\1: \2/; s/<[^>]*>//g; /^ *$/d'
            printf '\n\n# Earlier discussions\n\n'; cat "$RUNNER_TEMP/earlier.md"
            printf '\n\n# The discussion thread\n\nThe message that mentioned you is the one marked %s, and no other.\n\n' "$MARK"
            cat "$RUNNER_TEMP/thread.md"
          } > "$RUNNER_TEMP/prompt.md"
          # Web search and fetch only: no shell or file tools, so nothing in the thread can reach the runner.
          claude -p --model opus --tools "WebSearch,WebFetch" --allowedTools "WebSearch,WebFetch" \
            --strict-mcp-config --max-turns 20 --output-format json \
            --json-schema '{"type":"object","properties":{"relevant":{"type":"boolean"},"reply":{"type":"string"},"faq":{"type":"string"}},"required":["relevant","reply","faq"],"additionalProperties":false}' \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/result.json"
          # What this answer used, kept for a week so later runs can add up each person's use.
          jq --arg who "$WHO" --arg role "$ROLE" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{who: $who, role: $role, at: $at, usd: (.total_cost_usd // 0), models: (.modelUsage // {})}' \
            "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/usage/usage.json"
          jq -e '(.structured_output.reply | length > 0 and length < 6000) and (.structured_output.faq | length < 3000)' "$RUNNER_TEMP/result.json" > /dev/null

      - name: Post the reply
        env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_ID: ${{ steps.thread.outputs.discussion_id }}
          REPLY_TO: ${{ steps.thread.outputs.reply_to }}
          OVER: ${{ steps.limit.outputs.over }}
        run: |
          if [ "$OVER" = true ]; then
            reply="I cannot answer any more questions today. One of the team will see this one, and you can ask me again tomorrow."
            faq=""
          else
            reply=$(jq -r .structured_output.reply "$RUNNER_TEMP/result.json")
            faq=$(jq -r .structured_output.faq "$RUNNER_TEMP/result.json")
          fi
          if grep -Eq 'sk-ant-|gh[pousr]_[A-Za-z0-9]{20}|github_pat_|eyJ[A-Za-z0-9_-]{20}' <<<"$reply$faq"; then
            echo "::error::Reply looks like it contains a credential; not posting."; exit 1
          fi
          reply="**Claude** (Anthropic's AI assistant):"$'\n\n'"$reply"
          if [ -n "$REPLY_TO" ]; then
            url=$(gh api graphql -f d="$DISCUSSION_ID" -f r="$REPLY_TO" -f b="$reply" --jq .data.addDiscussionComment.comment.url -f query='
              mutation($d:ID!,$r:ID!,$b:String!){addDiscussionComment(input:{discussionId:$d,replyToId:$r,body:$b}){comment{url}}}')
          else
            url=$(gh api graphql -f d="$DISCUSSION_ID" -f b="$reply" --jq .data.addDiscussionComment.comment.url -f query='
              mutation($d:ID!,$b:String!){addDiscussionComment(input:{discussionId:$d,body:$b}){comment{url}}}')
          fi
          if [ -n "$faq" ]; then
            # One open issue collects the suggestions; a maintainer moves the good ones into a FAQ.
            issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "FAQ candidates"' --json number --jq '.[0].number // empty')
            if [ -z "$issue" ]; then
              issue=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "FAQ candidates" \
                --body "Questions Claude answered in Discussions that may come up again. Move the good ones into site/index.html (#faq) or docs/FAQ.md, then tick or close them.")
              issue=${issue##*/}
            fi
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "From $url"$'\n\n'"$faq"
          fi

      - name: Keep the usage
        if: always() && steps.ask.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-usage
          path: ${{ runner.temp }}/usage/usage.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Watch for heavy use
        if: always() && steps.ask.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          WHO: ${{ github.event.sender.login }}
          ROLE: ${{ github.event.comment.author_association || github.event.discussion.author_association }}
          ALERT: ${{ vars.CLAUDE_ALERT_USD || '3' }}
          WHERE: ${{ github.event.comment.html_url || github.event.discussion.html_url }}
        run: |
          case "$ROLE" in OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR) exit 0 ;; esac
          [ -f "$RUNNER_TEMP/usage/usage.json" ] || exit 0
          since=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p "$RUNNER_TEMP/earlier-usage"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/claude-discussions.yml/runs?created=%3E%3D$since&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID and .conclusion != \"skipped\") | .id" > "$RUNNER_TEMP/recent.txt"
          while read -r id; do
            # Runs that never asked Claude have no usage to fetch.
            gh run download "$id" --repo "$GITHUB_REPOSITORY" -n claude-usage -D "$RUNNER_TEMP/earlier-usage/$id" 2>/dev/null || true
          done < "$RUNNER_TEMP/recent.txt"
          find "$RUNNER_TEMP/earlier-usage" -name usage.json -exec cat {} + > "$RUNNER_TEMP/earlier.jsonl"
          # This person's use in the last 6 hours, before and including this answer, by model.
          jq -s -r --arg who "$WHO" --argjson alert "$ALERT" --slurpfile now "$RUNNER_TEMP/usage/usage.json" '
            ([.[] | select(.who == $who)]) as $before | ($before + $now) as $all |
            ($before | map(.usd) | add // 0) as $was | ($all | map(.usd) | add) as $is |
            if $was < $alert and $is >= $alert then
              "**\($who)** has used about $\($is * 100 | round / 100) at API prices in \($all | length) answers in the last 6 hours (alert at $\($alert)).\n\n| Model | Input | Output | Cache read | Cache write | Web searches | $ |\n|---|---|---|---|---|---|---|\n" +
              ([$all[].models | to_entries[]] | group_by(.key) | map(
                "| \(.[0].key) | \(map(.value.inputTokens // 0) | add) | \(map(.value.outputTokens // 0) | add) | \(map(.value.cacheReadInputTokens // 0) | add) | \(map(.value.cacheCreationInputTokens // 0) | add) | \(map(.value.webSearchRequests // 0) | add) | \(map(.value.costUSD // 0) | add * 100 | round / 100) |"
              ) | join("\n"))
            else empty end' "$RUNNER_TEMP/earlier.jsonl" > "$RUNNER_TEMP/alert.md"
          [ -s "$RUNNER_TEMP/alert.md" ] || exit 0
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Discussions usage"' --json number --jq '.[0].number // empty')
          if [ -z "$issue" ]; then
            issue=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Discussions usage" \
              --body "Someone outside the team used @claude in Discussions more than the alert level in 6 hours. Nothing was stopped; look at what they asked and decide whether it is abuse.")
            issue=${issue##*/}
          fi
          gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$(cat "$RUNNER_TEMP/alert.md")"$'\n\n'"Latest: $WHERE"
