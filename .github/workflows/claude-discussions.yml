# Answers @claude mentions in GitHub Discussions. Replies are posted by github-actions[bot] and
# say they come from Claude: Anthropic's app-token exchange only accepts its own action, which
# does not handle Discussions. Needs a repository secret CLAUDE_CODE_OAUTH_TOKEN made with
# `claude setup-token` on a Claude subscription.
name: Claude in Discussions

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

concurrency:
  group: claude-discussion-${{ github.event.discussion.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: >-
      github.event.sender.type != 'Bot' &&
      contains(github.event_name == 'discussion' && github.event.discussion.body || github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      discussions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Gather the thread
        id: thread
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.discussion.number }}
          COMMENT_ID: ${{ github.event.comment.node_id }}
        run: |
          gh api graphql -F n="$NUMBER" -f owner="${GITHUB_REPOSITORY%/*}" -f name="${GITHUB_REPOSITORY#*/}" -f query='
            query($owner:String!,$name:String!,$n:Int!){repository(owner:$owner,name:$name){discussion(number:$n){
              id title body author{login}
              comments(first:100){nodes{id body author{login} replies(first:100){nodes{id body author{login}}}}}}}}' \
            > "$RUNNER_TEMP/thread.json"
          jq -r --arg c "$COMMENT_ID" '.data.repository.discussion as $d |
            "## Discussion: \($d.title)\n\n**\($d.author.login // "unknown"):**\(if $c == "" then " (this is the message that mentioned you)" else "" end)\n\($d.body)\n",
            ($d.comments.nodes[] | "---\n**\(.author.login // "unknown"):**\(if .id == $c then " (this is the message that mentioned you)" else "" end)\n\(.body)\n",
              (.replies.nodes[] | "> **reply from \(.author.login // "unknown"):**\(if .id == $c then " (this is the message that mentioned you)" else "" end)\n\(.body)\n"))' \
            "$RUNNER_TEMP/thread.json" > "$RUNNER_TEMP/thread.md"
          {
            echo "discussion_id=$(jq -r .data.repository.discussion.id "$RUNNER_TEMP/thread.json")"
            # A reply to a reply has to hang off the top-level comment.
            echo "reply_to=$(jq -r --arg c "$COMMENT_ID" '[.data.repository.discussion.comments.nodes[] |
              select(.id == $c or any(.replies.nodes[]; .id == $c)) | .id][0] // ""' "$RUNNER_TEMP/thread.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Ask Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g --silent @anthropic-ai/claude-code@2.1.310
          {
            cat .github/claude/discussion-prompt.md
            for f in README.md AGENTS.md CONTRIBUTING.md docs/design-decisions.md; do
              printf '\n\n# Project document: %s\n\n' "$f"; cat "$f"
            done
            printf '\n\n# The discussion thread\n\n'; cat "$RUNNER_TEMP/thread.md"
          } > "$RUNNER_TEMP/prompt.md"
          # No tools and no MCP servers: Claude only reads the prompt and writes an answer.
          claude -p --model sonnet --tools "" --strict-mcp-config --max-turns 3 --output-format json \
            --json-schema '{"type":"object","properties":{"relevant":{"type":"boolean"},"reply":{"type":"string"}},"required":["relevant","reply"],"additionalProperties":false}' \
            < "$RUNNER_TEMP/prompt.md" > "$RUNNER_TEMP/result.json"
          jq -e '.structured_output.reply | length > 0 and length < 6000' "$RUNNER_TEMP/result.json" > /dev/null

      - name: Post the reply
        env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_ID: ${{ steps.thread.outputs.discussion_id }}
          REPLY_TO: ${{ steps.thread.outputs.reply_to }}
        run: |
          reply=$(jq -r .structured_output.reply "$RUNNER_TEMP/result.json")
          if grep -Eq 'sk-ant-|gh[pousr]_[A-Za-z0-9]{20}|github_pat_|eyJ[A-Za-z0-9_-]{20}' <<<"$reply"; then
            echo "::error::Reply looks like it contains a credential; not posting."; exit 1
          fi
          reply="**Claude** (Anthropic's AI assistant):"$'\n\n'"$reply"
          if [ -n "$REPLY_TO" ]; then
            gh api graphql -f d="$DISCUSSION_ID" -f r="$REPLY_TO" -f b="$reply" -f query='
              mutation($d:ID!,$r:ID!,$b:String!){addDiscussionComment(input:{discussionId:$d,replyToId:$r,body:$b}){comment{url}}}'
          else
            gh api graphql -f d="$DISCUSSION_ID" -f b="$reply" -f query='
              mutation($d:ID!,$b:String!){addDiscussionComment(input:{discussionId:$d,body:$b}){comment{url}}}'
          fi
