name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # Pinned to the v2.6.1 commit. Upstream still reads only the first 100 PR commits and the first page of
        # comments (checked against its default branch), so the CLA check is only complete for short PRs.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # This repo's own copy, so the signed text is pinned in its history.
          path-to-document: 'https://github.com/andeyePro/helpandeye/blob/main/CLA.md'
          branch: 'main'
          # Accounts exempt from signing: bots and andeye Ltd's own.
          allowlist: 'dependabot[bot],Aqueum'
