name: helpandeye
options:
  bundleIdPrefix: com.andeye
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  helpandeyeCore:
    path: helpandeyeCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  helpandeye:
    type: application
    platform: iOS
    sources: [helpandeye]
    dependencies:
      - package: helpandeyeCore
      - target: helpandeyeWatch
      - target: helpandeyeNotify
    entitlements:
      path: helpandeye/helpandeye.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        aps-environment: development
    info:
      path: helpandeye/Info.plist
      properties:
        CFBundleDisplayName: "Help&I"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central, remote-notification]
        NSBluetoothAlwaysUsageDescription: "Help&I uses Bluetooth to talk to your Help&I box, so a call for help can go over the local radio network."
        NSCameraUsageDescription: "Help&I uses the camera to scan a group's joining code."
        # Set to "$(AppIdentifierPrefix)com.andeye.help.shared" with a matching keychain-access-groups
        # entitlement once signed, so the notification extension can name callers.
        HelpAKeychainGroup: ""
        NSLocationWhenInUseUsageDescription: "When you choose to share where you are, Help&I sends it to your responders, encrypted, over the internet."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help
        TARGETED_DEVICE_FAMILY: "1"
  helpandeyeNotify:
    type: app-extension
    platform: iOS
    sources: [helpandeyeNotify]
    dependencies:
      - package: helpandeyeCore
    info:
      path: helpandeyeNotify/Info.plist
      properties:
        CFBundleDisplayName: "Help&I"
        HelpAKeychainGroup: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help.notify
        TARGETED_DEVICE_FAMILY: "1"
  helpandeyeWatch:
    type: application
    platform: watchOS
    sources: [helpandeyeWatch]
    info:
      path: helpandeyeWatch/Info.plist
      properties:
        CFBundleDisplayName: "Help&I"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.andeye.help
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  helpandeye:
    build:
      targets:
        helpandeye: all
