name: helpandeye
options:
  bundleIdPrefix: com.andeye
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  helpandeyeCore:
    path: helpandeyeCore
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  helpandeye:
    type: application
    platform: iOS
    sources: [helpandeye]
    dependencies:
      - package: helpandeyeCore
      - target: helpandeyeWatch
      - target: helpandeyeNotify
      - target: helpandeyeLocalPush
    entitlements:
      path: helpandeye/helpandeye.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.networking.networkextension: [app-push-provider]
        aps-environment: development
    info:
      path: helpandeye/Info.plist
      properties:
        CFBundleDisplayName: "Help&I"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [bluetooth-central, remote-notification]
        NSBluetoothAlwaysUsageDescription: "Help&I uses Bluetooth to talk to your Help&I box, so a call for help can go over the local radio network."
        NSCameraUsageDescription: "Help&I uses the camera to scan a group's joining code."
        # Set to "$(AppIdentifierPrefix)com.andeye.help.shared" with a matching keychain-access-groups
        # entitlement once signed, so the notification extension can name callers.
        HelpAKeychainGroup: ""
        NSLocalNetworkUsageDescription: "Help&I finds the other phones of your group on this Wi-Fi, so calls for help reach them directly, with no internet."
        NSBonjourServices: [_helpandi._tcp]
        NSLocationWhenInUseUsageDescription: "When you choose to share where you are, Help&I sends it to your responders, encrypted, over the internet."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help
        TARGETED_DEVICE_FAMILY: "1,2"
  helpandeyeNotify:
    type: app-extension
    platform: iOS
    sources: [helpandeyeNotify]
    dependencies:
      - package: helpandeyeCore
    info:
      path: helpandeyeNotify/Info.plist
      properties:
        CFBundleDisplayName: "Help&I"
        HelpAKeychainGroup: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help.notify
        TARGETED_DEVICE_FAMILY: "1,2"
  # Keeps home Wi-Fi listening with the phone locked (decision 19).
  helpandeyeLocalPush:
    type: app-extension
    platform: iOS
    sources: [helpandeyeLocalPush, helpandeye/HomeWiFi.swift, helpandeyeNotify/SharedStore.swift]
    dependencies:
      - package: helpandeyeCore
    entitlements:
      path: helpandeyeLocalPush/helpandeyeLocalPush.entitlements
      properties:
        com.apple.developer.networking.networkextension: [app-push-provider]
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: helpandeyeLocalPush/Info.plist
      properties:
        CFBundleDisplayName: "Help&I"
        HelpAKeychainGroup: ""
        NSLocalNetworkUsageDescription: "Help&I finds the other phones of your group on this Wi-Fi, so calls for help reach them directly, with no internet."
        NSBonjourServices: [_helpandi._tcp]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.app-push
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).LocalPushProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help.localpush
        TARGETED_DEVICE_FAMILY: "1,2"
  helpandeyeWatch:
    type: application
    platform: watchOS
    # The watch calls and responds by itself when the phone is out of reach, with the phone's own
    # relay, storage, notification and colour code.
    sources:
      - helpandeyeWatch
      - helpandeye/Relay.swift
      - helpandeye/Store.swift
      - helpandeye/Alerts.swift
      - helpandeye/Colours.swift
      - helpandeye/CallerVoice.swift
      - helpandeye/Sounds
    dependencies:
      - package: helpandeyeCore
      - target: helpandeyeWatchWidgets
    info:
      path: helpandeyeWatch/Info.plist
      properties:
        CFBundleDisplayName: "Help&I"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.andeye.help
        # self-care keeps the complication's 60-second countdown running with the wrist lowered.
        WKBackgroundModes: [remote-notification, self-care]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [helpandeye]
    entitlements:
      path: helpandeyeWatch/helpandeyeWatch.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
  helpandeyeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [helpandeyeWatchWidgets]
    info:
      path: helpandeyeWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Help&I"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help.watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
  helpandeyeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [helpandeyeUITests]
    dependencies:
      - target: helpandeye
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  helpandeyeWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    sources: [helpandeyeWatchUITests]
    dependencies:
      - target: helpandeyeWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andeye.help.watchuitests
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  helpandeye:
    build:
      targets:
        helpandeye: all
    test:
      targets:
        - helpandeyeUITests
  helpandeyeWatch:
    build:
      targets:
        helpandeyeWatch: all
    test:
      targets:
        - helpandeyeWatchUITests
