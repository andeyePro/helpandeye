; Help&I box firmware: MeshCore's companion build for the Heltec WiFi LoRa 32 V4 (OLED) with the
; Help&I UI task in place of ui-new. build.sh copies this file to the root of a MeshCore checkout,
; where platformio.ini already reads platformio.local.ini.
;
; Pins follow firmware/DESIGN.md section 5, still to be checked against Heltec's schematic and
; on a board. The amplifier gain is MeshCore's build comment for the V4 (a setting of 10 gives
; 22 dBm), to be measured before any box goes out. The draws (awake in milliamps, in deep sleep
; in microamps) are guesses until tests/MANUAL-TESTS.md section 54 measures them.
;
; A box that goes to a home is heltec_v4_helpandi as it is: flash encryption and secure boot are
; done after the build by `build.sh --release` and the chip's eFuses (DESIGN.md section 16), not
; by a build flag, because the Arduino core PlatformIO ships here is prebuilt without them.

[helpandi_base]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -I examples/companion_radio/ui-helpandi
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D DISPLAY_CLASS=SSD1306Display
  -D BLE_PIN_CODE=123456   ; random each start, shown on the screen; no Bluetooth without one
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D OFFLINE_QUEUE_SIZE=64
  -D FIRMWARE_VERSION='"v1.18.0-hi1"'
  -D HI_PIN_RED=6
  -D HI_PIN_AMBER=15
  -D HI_PIN_GREEN=16
  -D HI_PIN_MAINS=4
  -D HI_PIN_LED=48
  -D PIN_BUZZER=47
  -D HI_AMPLIFIER_GAIN_DB=12
  -D HI_BATTERY_MAH=3000
  -D HI_DRAW_AWAKE_MA=100
  -D HI_DRAW_ASLEEP_UA=1000
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-helpandi/*.cpp>
  +<../examples/companion_radio/ui-helpandi/core/*.cpp>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  Preferences

; The box as it goes to a home: three wired buttons, a buzzer, mains sensing. A box built without
; the mains divider sets HI_MAINS_SENSED=0: mains is then estimated from the battery's trend
; (DESIGN.md section 10), with less confidence.
[env:heltec_v4_helpandi]
extends = helpandi_base
build_flags =
  ${helpandi_base.build_flags}
  -D HI_LAYOUT_PRG_ONLY=0
  -D HI_MAINS_SENSED=1

; A plain board on a developer's desk: only PRG, which starts a 60-second countdown to Help;
; a second press stops it; holding it sends I'm OK. Not for the people Help&I is for. Its mains
; pin, pulled up, stages a power cut when grounded (MANUAL-TESTS 58); set HI_MAINS_SENSED=0 to
; try the battery's trend instead.
[env:heltec_v4_helpandi_dev]
extends = helpandi_base
build_flags =
  ${helpandi_base.build_flags}
  -D HI_LAYOUT_PRG_ONLY=1
  -D HI_MAINS_SENSED=1
